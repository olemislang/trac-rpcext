
[project]
name = TracRpcProtocols
license = GPL
topmod = tracrpcext
component = plugin_trac_rpcext
tracver = 0.11.1
demourl = https://opensvn.csie.org/traccgi/swlcu
summary = RPC protocols for Trac.
desc = This project implements RPC protocols not provided by 
        TracXMLRPC plugin. This could be due to conflicting 
        dependencies, policies, or maybe other reasons. In the former 
        case this plugin MIGHT NOT install by default all the 
        dependencies needed by every protocol implementation. In that 
        case it will check whether dependencies are available or not 
        and will display informative messages if it is not possible 
        to process client requests.
folder = rpcext

[deps/TracXMLRPC]
home = http://trac-hacks.org/wiki/XmlRpcPlugin
topmod = tracrpc
since = 1.0.0
verinfo = >=1.1.0
details = This package will be installed by default. If not found 
          then nothing will work.

[deps/HessianPy]
home = http://hessianpy.sourceforge.net
topmod = hessian
since = 1.0.0
verinfo = >=1.0.4
details = This package will be installed by default and is required 
          in order to access Trac API via 
          [http://hessian.caucho.com/doc/hessian-1.0-spec.xtp Hessian RPC].

[deps/soaplib]
home = http://wiki.github.com/jkp/soaplib-lxml
topmod = soaplib
since = 1.0.0
verinfo = >=0.8.1
details = This package will be installed by default and is required 
          in order to access Trac API via 
          [http://en.wikipedia.org/wiki/SOAP_(protocol) SOAP RPC].
          Currently there are plans to add support for HTTP transport 
          but [http://xmpp.org/extensions/xep-0072.html XMPP transport] 
          may be available too in a near future.

[deps/xmppxmlrpc]
home = http://pypi.python.org/pypi/xmppxmlrpc
topmod = XMPPXMLRPCServer
since = 1.0.0
verinfo = >=0.3
details = This package cannot be installed by default because the 
          original distribution seems not to be ''easy_installable''. 
          So you need to install it and configure it by hand. 
          It is required in order to access Trac API via 
          [http://xmpp.org/extensions/xep-0009.html Jabber-RPC].

